<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>個人藏書庫 (Book Storage)</title>
  
  <!-- PWA & Mobile Meta -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="個人藏書庫">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css?v=6">
</head>

<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <span class="brand-icon">📚</span>
        <span>藏書庫</span>
      </div>
      <div class="header-actions">
        <button id="btn-export-zip" class="btn-icon" title="匯出藏書 CSV 與封面圖片 (ZIP)">📥</button>
        <button id="theme-toggle" class="btn-icon" title="切換深淺色主題">🌙</button>
      </div>
    </div>
  </header>

  <!-- Offline Status Banner -->
  <div id="offline-banner" class="offline-banner">
    ⚡ 目前處於離線狀態：使用本地 IndexedDB 快取資料
  </div>

  <!-- Main Content Area -->
  <main class="app-main">
    <!-- Controls Bar (搜尋列 + 手機專用書架選擇大按鈕) -->
    <div class="controls-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="搜尋書名、作者、ISBN、出版社、個人筆記..." autocomplete="off">
      </div>
      <!-- 手機版專屬書架選擇按鈕 (螢幕 <= 768px 時呈現) -->
      <button id="btn-mobile-shelf-trigger" class="btn-mobile-shelf-trigger" title="選擇所屬書架分類">
        <div class="shelf-btn-left">
          <span class="shelf-btn-icon">📁</span>
          <span id="mobile-shelf-label" class="shelf-btn-label">所有書籍</span>
        </div>
        <span class="shelf-btn-arrow">▾</span>
      </button>
    </div>

    <!-- Filter & Shelves Horizontal Tabs (電腦/平板寬螢幕呈現) -->
    <div id="filter-tabs" class="filter-tabs">
      <!-- Generated Dynamically -->
    </div>

    <!-- Summary Stats -->
    <div class="stats-summary">
      <span id="total-count">共 0 本藏書</span>
    </div>

    <!-- Books Grid Container -->
    <div id="books-grid" class="books-grid">
      <!-- Generated Dynamically -->
    </div>

    <!-- Pagination Controls -->
    <div id="pagination-container" class="pagination-container">
      <!-- Generated Dynamically -->
    </div>

    <!-- Page Footer Back-to-Top Button -->
    <div class="page-footer-action">
      <button id="btn-back-to-top" class="btn btn-secondary btn-back-to-top">
        ⬆️ 回到頁首
      </button>
    </div>
  </main>

  <!-- Floating Action Buttons (FAB) -->
  <div class="fab-container">
    <button id="btn-open-manual-add" class="btn-fab btn-fab-secondary" title="手動輸入 ISBN 查詢或自訂新增書籍">
      ✍️
    </button>
    <button id="btn-open-scan" class="btn-fab" title="掃描 ISBN 條碼新增書籍">
      📷
    </button>
  </div>

  <!-- Barcode Scanner Modal -->
  <div id="scan-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">📷 掃描書籍條碼</h3>
        <button id="btn-close-scan" class="btn-icon">✕</button>
      </div>
      <div class="modal-body">
        <div class="scanner-container">
          <video id="scanner-video" class="scanner-video" playsinline></video>
          <div class="scanner-laser"></div>
        </div>
        <p class="scanner-hint">請將手機鏡頭對準書籍封底的 ISBN 條碼</p>
        <button id="btn-switch-to-manual" class="btn btn-secondary" style="width: 100%; margin-top: 0.75rem;">
          手動輸入 ISBN 查詢
        </button>
      </div>
    </div>
  </div>

  <!-- Manual Add Modal -->
  <div id="manual-add-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">➕ 新增藏書</h3>
        <button id="btn-close-manual-add" class="btn-icon">✕</button>
      </div>
      <div class="modal-body">
        <!-- 快速 ISBN 外部查詢卡片 -->
        <div class="manual-isbn-search-card">
          <label class="form-label" style="font-weight:600;">🔍 手動輸入 ISBN 快速查詢書目</label>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.25rem;">
            <input type="text" id="manual-isbn-input" class="form-control" placeholder="輸入 10 或 13 碼 ISBN，例：9786267156841" autocomplete="off">
            <button id="btn-manual-isbn-search" class="btn btn-primary" style="white-space: nowrap;">
              查詢
            </button>
          </div>
          <p id="manual-isbn-hint" style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem;">
            優先查詢三民書局、OpenLibrary、Google Books 等資料庫
          </p>
        </div>

        <form id="custom-book-form" onsubmit="return false;" style="margin-top: 1rem;">
          <div class="form-group">
            <label class="form-label">書名 <span style="color: var(--danger);">*</span></label>
            <input type="text" id="manual-title" class="form-control" required placeholder="例：原子習慣">
          </div>

          <div class="form-row" style="display: flex; gap: 0.75rem;">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">作者</label>
              <input type="text" id="manual-author" class="form-control" placeholder="例：詹姆斯‧克利爾">
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">出版社</label>
              <input type="text" id="manual-publisher" class="form-control" placeholder="例：方智">
            </div>
          </div>

          <div class="form-row" style="display: flex; gap: 0.75rem;">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">ISBN-13</label>
              <input type="text" id="manual-isbn13" class="form-control" placeholder="978...">
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">出版日期</label>
              <input type="text" id="manual-pubdate" class="form-control" placeholder="2019-06-01">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">封面圖片網址 (URL)</label>
            <input type="url" id="manual-cover" class="form-control" placeholder="https://...（儲存時將自動下載備份至伺服器）">
          </div>

          <div class="form-row" style="display: flex; gap: 0.75rem;">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">所屬書架</label>
              <select id="manual-shelf" class="form-control">
                <option value="">未分類</option>
              </select>
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">分類標籤</label>
              <input type="text" id="manual-category" class="form-control" placeholder="例：心理學、文學">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">書籍簡介 / 內容大意</label>
            <textarea id="manual-desc" class="form-control" rows="2" placeholder="簡述這本書的內容..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">個人心得 / 備忘筆記</label>
            <textarea id="manual-notes" class="form-control" rows="2" placeholder="記錄你的筆記..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="btn-cancel-manual-add" class="btn btn-secondary">取消</button>
        <button id="btn-submit-manual-add" class="btn btn-primary">➕ 儲存並加入藏書</button>
      </div>
    </div>
  </div>

  <!-- Book Detail / Edit Modal (含替換書封功能) -->
  <div id="book-detail-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="detail-modal-title" class="modal-title">書籍資訊</h3>
        <button id="btn-close-detail" class="btn-icon">✕</button>
      </div>
      <div id="detail-modal-body" class="modal-body">
        <!-- Form / Info -->
      </div>
      <div id="detail-modal-footer" class="modal-footer">
        <!-- Actions -->
      </div>
    </div>
  </div>

  <!-- Mobile Shelf Bottom Sheet Modal (手機專用抽屜) -->
  <div id="shelf-bottom-sheet" class="modal-overlay bottom-sheet-overlay">
    <div class="bottom-sheet-card">
      <div class="bottom-sheet-header">
        <div class="bottom-sheet-handle"></div>
        <div class="bottom-sheet-title-row">
          <h3 class="modal-title">📁 選擇所屬書架</h3>
          <button id="btn-close-shelf-sheet" class="btn-icon">✕</button>
        </div>
      </div>
      <div id="shelf-sheet-list" class="bottom-sheet-list">
        <!-- Generated Dynamically -->
      </div>
    </div>
  </div>

  <!-- Scroll To Top Floating Button -->
  <button id="floating-back-to-top" class="floating-back-to-top" title="回到頁首">
    ⬆️
  </button>

  <!-- JavaScript Modules -->
  <script src="/static/js/db_offline.js?v=6"></script>
  <script src="/static/js/scanner.js?v=6"></script>
  <script src="/static/js/app.js?v=6"></script>
</body>
</html>
