version: "3.8"

services:
  book-storage:
    build: .
    container_name: book-storage
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 掛載封面圖檔資料夾至 NAS 實體路徑（方便在 Windows 檔案總管放入圖檔）
      - ./app/static/covers:/app/app/static/covers
      # 掛載資料夾來存放 SQLite 資料庫，這樣最安全，Docker 不會出錯
      - ./data:/app/data
    environment:
      - TZ=Asia/Taipei
